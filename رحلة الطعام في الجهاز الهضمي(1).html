 b:function(r){var o=['النشا: يهضمه إنزيم الأميليز في الفم ثم إنزيمات البنكرياس، ويتحول إلى سكر بسيط يمتصه الدم.','البروتين: يبدأ هضمه الببسين في المعدة ثم تكمله إنزيمات البنكرياس، ويتحول إلى أحماض أمينية.','الدهون: تفتّتها الصفراء ثم يهضمها إنزيم الليباز، وتتحول إلى أحماض دهنية وجليسرول.'],res=$('.res',r);$('select',r).onchange=function(){if(this.value==='')return;res.textContent=o[this.value];say(o[this.value],res)}}},

/* ---------- quiz ---------- */
function quizHTML(key,qs){
  QS[key]=qs.map(function(q){return shuf(q[1].map(function(o,j){return{o:o,ok:j===q[2]}}))});
  return '<div class="quiz" data-k="'+key+'">'+qs.map(function(q,i){return '<fieldset class="qq"><legend class="r">'+(i+1)+'. '+q[0]+'</legend>'+QS[key][i].map(function(o,j){return '<label class="opt r"><input type="radio" name="'+key+'_'+i+'" value="'+j+'"> '+o.o+'</label>'}).join('')+'<p class="fb r" hidden></p></fieldset>'}).join('')+'<button class="main chk">تحقق من إجاباتي</button><p class="r score" role="status"></p></div>';
}
function bindQuiz(key,qs){
  var box=$('.quiz[data-k="'+key+'"]'),btn=$('.chk',box);
  btn.onclick=function(){
    if(btn.dataset.done){var t=document.createElement('div');t.innerHTML=quizHTML(key,qs);var nb=t.firstChild;box.replaceWith(nb);mkr(nb);bindQuiz(key,qs);$('legend',nb).scrollIntoView({block:'center'});return}
    var n=0;
    box.querySelectorAll('fieldset').forEach(function(f,i){
      var c=f.querySelector('input:checked'),fb=$('.fb',f),opts=QS[key][i],right=opts.filter(function(o){return o.ok})[0].o,ok=c&&opts[+c.value].ok;
      if(ok)n++;
      fb.hidden=false;fb.className='fb r '+(ok?'ok':'bad');
      fb.textContent=ok?'✓ إجابة صحيحة. '+qs[i][3]:(c?'✗ إجابة خاطئة. ':'✗ لم تختر إجابة. ')+'الصحيحة: '+right+'. '+qs[i][3];
      f.querySelectorAll('input').forEach(function(x){x.disabled=true});
    });
    scores[key]=[n,qs.length];
    var sc=$('.score',box),msg='نتيجتك: '+n+' من '+qs.length+(n===qs.length?'. أحسنت!':'. راجع الشرح وأعد المحاولة.');
    sc.textContent=msg;btn.textContent='أعد الاختبار';btn.dataset.done=1;say(msg,sc);if(n===qs.length)party();
  };
}

/* ---------- views ---------- */
function allQs(){var F=[];S.forEach(function(s){F.push(s.q[0],s.q[2])});return F}
var COL=['#e5604d','#e08a1e','#c9a400','#d6498a','#3b82c4'];
function prog(){var n=0;for(var k=0;k<5;k++)if(scores['s'+k])n++;return '<div class="r prog" role="progressbar" aria-valuemin="0" aria-valuemax="5" aria-valuenow="'+n+'" aria-label="تقدّمك">تقدّمك: أكملت '+n+' من 5 اختبارات</div><div class="track" aria-hidden="true"><span style="width:'+(n*20)+'%"></span></div>'}
function party(){if(window.matchMedia&&matchMedia('(prefers-reduced-motion:reduce)').matches)return;var c=['#ffd54a','#e5604d','#3b82c4','#4fc3ae','#d6498a'];for(var i=0;i<36;i++){var s=document.createElement('span');s.className='cf';s.setAttribute('aria-hidden','true');s.style.left=Math.random()*100+'vw';s.style.background=c[i%5];s.style.animationDelay=Math.random()*.5+'s';document.body.appendChild(s);setTimeout(function(x){x.remove()},2800,s)}}
function homeV(){
  return '<section class="hero"><h1 class="r" tabindex="-1">رحلة الطعام في الجهاز الهضمي</h1><p class="r lead">الجهاز الهضمي أنبوب طويل يبلغ طوله نحو تسعة أمتار، يبدأ بالفم وينتهي بالشرج. وظيفته تحويل الطعام إلى مواد بسيطة يستطيع الجسم امتصاصها. اختر محطة لتبدأ الرحلة.</p>'+prog()+'</section><div class="grid">'+
  S.map(function(s,k){var sc=scores['s'+k];return '<button class="big r" data-go="s'+k+'" style="--c:'+COL[k]+';--i:'+k+'"><span class="ico" aria-hidden="true">'+s.i+'</span>المحطة '+['الأولى','الثانية','الثالثة','الرابعة','الخامسة'][k]+': '+s.t+(sc?'<small>نتيجتك '+sc[0]+' من '+sc[1]+'</small>':'')+'</button>'}).join('')+
  '</div><h2 class="r">أدوات إضافية</h2><div class="grid"><button class="big alt r" data-go="gloss"><span class="ico" aria-hidden="true">📖</span>قاموس المصطلحات</button><button class="big alt r" data-go="final"><span class="ico" aria-hidden="true">📝</span>الاختبار النهائي'+(scores.final?'<small>نتيجتك '+scores.final[0]+' من '+scores.final[1]+'</small>':'')+'</button><button class="big alt r" data-go="lab"><span class="ico" aria-hidden="true">🧩</span>نشاط التركيب: ركّب الجهاز الهضمي</button></div>';
}
function stationV(k){
  var s=S[k],nx=k<4?'<button class="main" data-go="s'+(k+1)+'">المحطة التالية: '+S[k+1].t+'</button>':'<button class="main" data-go="final">الاختبار النهائي</button><button data-go="lab">نشاط التركيب</button>';
  return '<div class="steps" aria-hidden="true">'+S.map(function(x,j){return '<i class="'+(j===k?'cur':j<k?'past':'')+'"></i>'}).join('')+'</div><h1 class="r stitle" tabindex="-1" style="--c:'+COL[k]+'">المحطة '+['الأولى','الثانية','الثالثة','الرابعة','الخامسة'][k]+': '+s.t+'</h1><h2 class="r">الشرح</h2>'+s.d.map(function(p){return '<p class="r">'+p+'</p>'}).join('')+'<p class="r simple"><strong>بجمل بسيطة:</strong> '+s.s+'</p><h2 class="r">نشاط تفاعلي</h2><div class="panel" id="act">'+A[k].h+'</div><h2 class="r">اختبار تقويمي</h2>'+quizHTML('s'+k,s.q)+'<div class="nav"><button data-go="home">الرئيسية</button>'+(k>0?'<button data-go="s'+(k-1)+'">المحطة السابقة</button>':'')+nx+'</div>';
}
function glossV(){return '<h1 class="r" tabindex="-1">قاموس المصطلحات</h1><dl>'+G.map(function(g){return '<div class="r"><dt>'+g[0]+'</dt><dd>'+g[1]+'</dd></div>'}).join('')+'</dl><div class="nav"><button data-go="home">الرئيسية</button></div>'}
function finalV(){return '<h1 class="r" tabindex="-1">الاختبار النهائي</h1><p class="r lead">عشرة أسئلة تغطي المحطات الخمس. اقرأ كل سؤال جيدًا ثم اضغط «تحقق من إجاباتي».</p>'+quizHTML('final',allQs())+'<div class="nav"><button data-go="home">الرئيسية</button><button data-go="lab">نشاط التركيب</button></div>'}

/* ---------- assembly ---------- */
var O=[
{k:'mouth',n:'الفم',pos:'الموضع 1: في الرأس',clue:'الفم: أول محطة في الرحلة، ويقع في الرأس.',c:'#f6a6a6',sh:'<ellipse class="shp" cx="150" cy="48" rx="30" ry="15"/>',nx:150,ny:52,inn:1},
{k:'esoph',n:'المريء',pos:'الموضع 2: أنبوب عمودي في الرقبة والصدر',clue:'المريء: أنبوب عمودي يصل الفم بالمعدة.',c:'#f3c58b',sh:'<rect class="shp" x="142" y="85" width="16" height="95" rx="8"/>',nx:272,ny:135},
{k:'stomach',n:'المعدة',pos:'الموضع 3: أعلى البطن جهة يسار الجسم',clue:'المعدة: كيس عضلي في أعلى البطن جهة يسار الجسم.',c:'#f0e08a',sh:'<ellipse class="shp" cx="180" cy="205" rx="36" ry="27"/>',nx:180,ny:209,inn:1},
{k:'liver',n:'الكبد',pos:'الموضع 4: أعلى البطن جهة يمين الجسم',clue:'الكبد: أكبر غدة في الجسم، في أعلى البطن جهة يمين الجسم.',c:'#c79a7a',sh:'<ellipse class="shp" cx="108" cy="195" rx="42" ry="24"/>',nx:108,ny:199,inn:1},
{k:'pancreas',n:'البنكرياس',pos:'الموضع 5: شريط أفقي تحت المعدة',clue:'البنكرياس: غدة طويلة تقع خلف المعدة وتحتها.',c:'#e9d3a0',sh:'<ellipse class="shp" cx="150" cy="245" rx="42" ry="10"/>',nx:150,ny:249,inn:1},
{k:'small',n:'الأمعاء الدقيقة',pos:'الموضع 6: وسط البطن، أنبوب ملتف',clue:'الأمعاء الدقيقة: أنبوب طويل ملتف في وسط البطن.',c:'#f5a9c9',sh:'<path class="shp" fill="none" d="M115 295h70v14h-70v14h70v14h-70v14h70"/>',nx:272,ny:318},
{k:'large',n:'الأمعاء الغليظة',pos:'الموضع 7: إطار على شكل حرف U حول وسط البطن',clue:'الأمعاء الغليظة: إطار يحيط بالأمعاء الدقيقة من الجهات الثلاث.',c:'#9cc9ea',sh:'<path class="shp" fill="none" d="M98 365V272h104v93"/>',nx:150,ny:392}
];
function labV(){
  var cards=shuf(O.slice()).map(function(o){return '<button class="r card" data-k="'+o.k+'" aria-pressed="false">'+o.n+'</button>'}).join('');
  var svg='<svg class="body" viewBox="0 0 320 420" role="group" aria-label="مجسم الجسم الفارغ ذو سبعة مواضع"><circle class="outline" cx="150" cy="45" r="40"/><rect class="outline" x="70" y="125" width="160" height="275" rx="40"/>'+
  O.map(function(o,i){return '<g class="slot r" data-k="'+o.k+'" role="button" tabindex="0" aria-label="'+o.pos+': فارغ">'+o.sh.replace('class="shp"','class="shp" style="stroke-width:'+(o.k==='small'||o.k==='large'?16:3)+'"')+'<text class="num" x="'+(o.k==='large'?204:o.k==='esoph'?150:o.k==='small'?200:o.nx)+'" y="'+(o.k==='large'?310:o.k==='esoph'?132:o.k==='small'?318:o.ny)+'">'+(i+1)+'</text><text class="lbl'+(o.inn?' in':'')+'" x="'+o.nx+'" y="'+o.ny+'">'+o.n+'</text></g>'}).join('')+'</svg>';
  return '<h1 class="r" tabindex="-1">نشاط التركيب: ركّب الجهاز الهضمي</h1><p class="r lead">اختر عضوًا من الأزرار، فتسمع وصفًا لمكانه، ثم اختر الموضع المناسب له على المجسم (سبعة مواضع مرقّمة). عند الخطأ ستحصل على تلميح.</p><div class="cards" role="group" aria-label="أعضاء الجهاز الهضمي">'+cards+'</div><p class="r res" id="msg" aria-live="polite">اختر عضوًا للبدء.</p>'+svg+'<div class="nav"><button id="reset">أعد التركيب</button><button data-go="home">الرئيسية</button></div>';
}
function bindLab(){
  var sel=null,done={},msg=$('#msg');
  function m(t){msg.textContent=t;say(t,msg)}
  app.querySelectorAll('.card').forEach(function(b){b.onclick=function(){if(b.disabled)return;sel=b.dataset.k;$('svg.body').classList.add('pick');app.querySelectorAll('.card').forEach(function(x){x.setAttribute('aria-pressed',x===b)});m(O.filter(function(o){return o.k===sel})[0].clue+' اختر الآن موضعه.')}});
  function place(g){
    var k=g.dataset.k;if(done[k]){m('هذا الموضع ممتلئ بالفعل.');return}
    if(!sel){m('اختر عضوًا من الأزرار أولًا.');return}
    var o=O.filter(function(x){return x.k===sel})[0];
    if(sel!==k){m('ليس هنا. '+o.clue+' جرّب موضعًا آخر.');return}
    done[k]=1;g.classList.add('on');var sh=g.querySelector('.shp');if(k==='small'||k==='large'){sh.style.stroke=o.c}else{sh.style.fill=o.c}sh.setAttribute('aria-hidden','true');
    g.setAttribute('aria-label',o.pos+': ممتلئ بـ'+o.n);
    var cd=app.querySelector('.card[data-k="'+k+'"]');cd.disabled=true;cd.setAttribute('aria-pressed','false');sel=null;
    var n=Object.keys(done).length;if(n===7)party();
    m(n===7?'أحسنت! ركّبت الجهاز الهضمي كاملًا: الفم، ثم المريء، ثم المعدة، مع الكبد والبنكرياس، ثم الأمعاء الدقيقة، ثم الغليظة.':'صحيح! وضعت '+o.n+' في مكانه. تبقّى '+(7-n)+' من الأعضاء.');
  }
  app.querySelectorAll('.slot').forEach(function(g){g.onclick=function(){place(g)};g.onkeydown=function(e){if(e.key==='Enter'||e.key===' '){e.preventDefault();place(g)}}});
  $('#reset').onclick=function(){go('lab')};
}

function go(v){
  stop();view=v;
  app.innerHTML=v==='home'?homeV():v==='gloss'?glossV():v==='final'?finalV():v==='lab'?labV():stationV(+v.slice(1));
  mkr(app);
  if(v[0]==='s'&&v.length===2){var k=+v[1];$('#act').innerHTML=A[k].h;A[k].b($('#act'));bindQuiz(v,S[k].q)}
  if(v==='final')bindQuiz('final',allQs());
  if(v==='lab')bindLab();
  var h=$('h1');if(h){h.focus({preventScroll:true})}window.scrollTo(0,0);
}
app.addEventListener('click',function(e){var b=e.target.closest('[data-go]');if(b)go(b.dataset.go)});
document.getElementById('home').onclick=function(){go('home')};

/* ---------- speech controls ---------- */
function setOn(v){
  on=v;toggle.setAttribute('aria-pressed',v);toggle.textContent=v?'إيقاف القراءة الصوتية':'تشغيل القراءة الصوتية';
  if(v){if(synth&&!voice)pickVoice();setStatus(voice||!synth?'القراءة الصوتية تعمل. مرّر المؤشر فوق أي سطر أو تنقّل بمفتاح Tab.':'القراءة الصوتية تعمل، لكن لم يُعثر على صوت عربي في جهازك، وقد يكون النطق غير دقيق.');say('تم تشغيل القراءة الصوتية')}
  else{stop();setStatus('القراءة الصوتية متوقفة.')}
}
toggle.onclick=function(){setOn(!on)};
document.getElementById('stop').onclick=function(){stop();setStatus('تم إيقاف الصوت.')};
document.addEventListener('mouseover',function(e){
  if(!on)return;var el=e.target.closest&&e.target.closest('.r');if(!el||el===lastHover)return;lastHover=el;clearTimeout(timer);
  timer=setTimeout(function(){stopQ=true;say(txt(el),el)},250);
});
document.addEventListener('mouseout',function(e){var el=e.target.closest&&e.target.closest('.r');if(el&&!el.contains(e.relatedTarget)){if(lastHover===el)lastHover=null;clearTimeout(timer)}});
document.addEventListener('focusin',function(e){if(!on)return;var el=e.target.closest&&e.target.closest('.r');if(el){stopQ=true;say(txt(el),el)}});
document.addEventListener('touchstart',function(e){if(!on)return;var el=e.target.closest&&e.target.closest('.r');if(el){stopQ=true;say(txt(el),el)}},{passive:true});
document.getElementById('readall').onclick=function(){
  if(!on)setOn(true);stopQ=false;var i=0,list=Array.prototype.slice.call(app.querySelectorAll('.r')).filter(function(x){return !x.hidden&&!x.closest('[hidden]')});
  (function next(){if(stopQ||i>=list.length)return;var el=list[i++];el.scrollIntoView({block:'center'});say(txt(el),el,function(){setTimeout(next,150)})})();
};
document.addEventListener('keydown',function(e){if(e.key==='Escape')stop()});
var size=1.25;function ap(){document.documentElement.style.setProperty('--fs',size+'rem')}
document.getElementById('bigger').onclick=function(){size=Math.min(2.2,size+.15);ap()};
document.getElementById('smaller').onclick=function(){size=Math.max(1,size-.15);ap()};
go('home');
})();
</script>
